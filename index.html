<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .profile-img {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-img img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
            vertical-align: top;
        }
        td.label {
            font-weight: bold;
            width: 35%;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">
            <!-- Ganti URL foto di bawah ini dengan lokasi foto Anda -->
            <img src="https://via.placeholder.com/120" alt="Foto Profil">
        </div>
        
        <h2>BIODATA DIRI</h2>

        <table>
            <tr>
                <td class="label">Nama Lengkap</td>
                <td>: Carissa Putri Alnabira</td>
            </tr>
            <tr>
                <td class="label">Tempat, Tgl Lahir</td>
                <td>: Bandung, 7 Januari 2011</td>
            </tr>
            <tr>
                <td class="label">Jenis Kelamin</td>
                <td>:Perempuan</td>
            </tr>
            <tr>
                <td class="label">Alamat</td>
                <td>: Jl. Cigadung Raya Barat</td>
            </tr>
            <tr>
                <td class="label">Agama</td>
                <td>: Islam </td>
            </tr>
            <tr>
                <td class="label">Email</td>
                <td>: email@example.com</td>
            </tr>
            <tr>
                <td class="label">Nomor HP</td>
                <td>: 0859-6034-9226</td>
            </tr>
            <tr>
                <td class="label">Hobi</td>
                <td>: Menyanyi,Memasak,Bermain alat musik</td>
            </tr>
        </table>
    </div>

</body>
</html>
